<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guru Cerdas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#EEF8F1;--card:#fff;--mint:#D4EEDD;--mint2:#B7E1C6;--green:#2F7A55;--ink:#1E3328;--soft:#5B7366;--warn:#C0562F;--r:20px}
*{box-sizing:border-box}
html{font-size:19px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-weight:500;line-height:1.55;padding-bottom:96px}
h1,h2,h3{font-family:'Fredoka','Nunito',sans-serif;font-weight:600;margin:0 0 .5rem;line-height:1.25}
h1{font-size:1.7rem}h2{font-size:1.4rem}h3{font-size:1.15rem}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:14px;padding:.8rem 1.2rem;min-height:52px;background:var(--green);color:#fff;font-weight:700}
button.alt{background:var(--mint);color:var(--green)}
button.danger{background:#fbe7df;color:var(--warn)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--green);outline-offset:2px}
input,select{width:100%;min-height:52px;padding:.6rem .9rem;border:2px solid var(--mint2);border-radius:14px;background:#fff}
label{display:block;font-weight:700;margin:.8rem 0 .3rem}
.wrap{max-width:860px;margin:0 auto;padding:1.2rem}
.card{background:var(--card);border-radius:var(--r);padding:1.2rem;margin-bottom:1rem;box-shadow:0 2px 0 var(--mint2)}
.top{display:flex;align-items:center;gap:.8rem;justify-content:space-between;padding:1rem 1.2rem;background:var(--mint);}
.brand{display:flex;align-items:center;gap:.7rem;font-family:'Fredoka';font-size:1.4rem;font-weight:600;color:var(--green)}
.mascot{width:46px;height:46px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:1.5rem;overflow:hidden}
.mascot img{width:100%;height:100%;object-fit:cover}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:3px solid var(--mint);padding:.4rem;gap:.3rem;z-index:5}
nav button{flex:1;background:none;color:var(--soft);display:flex;flex-direction:column;align-items:center;gap:0;padding:.4rem .2rem;font-size:.8rem;min-height:60px}
nav button b{font-size:1.4rem;line-height:1.2}
nav button.on{background:var(--mint);color:var(--green)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.8rem}
.stat{background:var(--mint);border-radius:var(--r);padding:1rem}
.stat span{display:block;font-family:'Fredoka';font-size:2rem;color:var(--green)}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.row>*{flex:1 1 140px}
.item{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.8rem 0;border-bottom:2px solid var(--bg)}
.item:last-child{border:0}
.seg{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.4rem}
.seg button{flex:1 1 auto;background:var(--bg);color:var(--soft);padding:.5rem .7rem;min-height:48px}
.seg button.on{background:var(--green);color:#fff}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:.4rem;text-align:left}
td input{min-height:46px;padding:.3rem .5rem;text-align:center}
.final{font-weight:700;color:var(--green);font-size:1.2rem;text-align:center}
.msg{color:var(--warn);font-weight:700;min-height:1.5rem}
.muted{color:var(--soft)}
.login{max-width:430px;margin:8vh auto 0;text-align:center}
.login .mascot{width:96px;height:96px;font-size:3rem;margin:0 auto 1rem;background:var(--mint)}
.login form{text-align:left}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.8rem 1.4rem;border-radius:14px;z-index:9}
@media (prefers-reduced-motion:no-preference){button{transition:background .15s}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ====== ISI DUA BARIS INI DARI SUPABASE > Project Settings > API ====== */
const SUPABASE_URL = 'https://vfjnvuqingtpchcetuga.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZmam52dXFpbmd0cGNoY2V0dWdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwOTU2ODYsImV4cCI6MjEwNjY3MTY4Nn0.Ms7BLx2DHl-b5pZSVntdw1wl2WAs3ON8uTpHu2DeNeQ';
/* Logo/maskot: ganti dengan alamat gambar, mis. 'maskot.png' */
const MASCOT = '';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Date().toISOString().slice(0,10);
const mascot = () => `<div class="mascot">${MASCOT ? `<img src="${esc(MASCOT)}" alt="Maskot Guru Cerdas">` : '🦉'}</div>`;
let view = 'dashboard', user = null;

function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2200)}
const emailOf = u => u.trim().toLowerCase().replace(/[^a-z0-9._-]/g,'') + '@gurucerdas.app';

/* ---------- Login ---------- */
function loginView(mode='masuk'){
  $('#app').innerHTML = `<div class="wrap login">${mascot()}<h1>Guru Cerdas</h1>
  <p class="muted">Satu aplikasi untuk mengurangi pekerjaan administrasi, agar Bapak/Ibu bisa fokus mengajar.</p>
  <form class="card" id="f"><label for="u">Nama pengguna</label><input id="u" autocomplete="username" required>
  <label for="p">Kata sandi</label><input id="p" type="password" autocomplete="${mode==='masuk'?'current-password':'new-password'}" minlength="6" required>
  <p class="msg" id="m" role="alert"></p>
  <button style="width:100%">${mode==='masuk'?'Masuk':'Buat akun'}</button></form>
  <button class="alt" id="sw" style="width:100%">${mode==='masuk'?'Belum punya akun? Buat akun':'Sudah punya akun? Masuk'}</button></div>`;
  $('#sw').onclick = () => loginView(mode==='masuk'?'daftar':'masuk');
  $('#f').onsubmit = async e => {
    e.preventDefault(); $('#m').textContent='Mohon tunggu…';
    const c = {email: emailOf($('#u').value), password: $('#p').value};
    const {error} = mode==='masuk' ? await sb.auth.signInWithPassword(c) : await sb.auth.signUp(c);
    if(error) $('#m').textContent = mode==='masuk' ? 'Nama pengguna atau kata sandi salah.' : 'Akun belum bisa dibuat: ' + error.message;
    else boot();
  };
}

/* ---------- Kerangka ---------- */
const MENU = [['dashboard','🏠','Beranda'],['kelas','👩‍🏫','Kelas'],['presensi','📅','Presensi'],['nilai','📝','Nilai'],['lain','✨','Lainnya']];
function shell(){
  const name = (user.email||'').split('@')[0];
  $('#app').innerHTML = `<div class="top"><div class="brand">${mascot()}Guru Cerdas</div><button class="alt" id="out">Keluar</button></div>
  <div class="wrap" id="main"></div>
  <nav aria-label="Menu utama">${MENU.map(([k,i,t])=>`<button data-k="${k}" class="${k===view?'on':''}"><b>${i}</b>${t}</button>`).join('')}</nav>`;
  $('#out').onclick = async()=>{await sb.auth.signOut();loginView()};
  document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.k;shell()});
  ({dashboard,kelas,presensi,nilai,lain})[view]();
}
async function listKelas(){const {data}=await sb.from('kelas').select('*').order('nama');return data||[]}
const kelasSelect = (ks,id,sel) => `<select id="${id}">${ks.map(k=>`<option value="${k.id}" ${k.id===sel?'selected':''}>${esc(k.nama)}</option>`).join('')}</select>`;
const needKelas = () => $('#main').innerHTML = `<div class="card"><h2>Belum ada kelas</h2><p>Buat kelas dulu agar bisa mulai.</p><button id="go">Buat kelas</button></div>`;

/* ---------- Beranda ---------- */
async function dashboard(){
  const name = (user.email||'').split('@')[0];
  const [k,s,p] = await Promise.all([
    sb.from('kelas').select('id',{count:'exact',head:true}),
    sb.from('siswa').select('id',{count:'exact',head:true}),
    sb.from('presensi').select('id',{count:'exact',head:true}).eq('tanggal',today())]);
  const tgl = new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  $('#main').innerHTML = `<h1>Selamat datang, ${esc(name)}</h1><p class="muted">${tgl}</p>
  <div class="grid"><div class="stat"><span>${k.count??0}</span>Kelas</div><div class="stat"><span>${s.count??0}</span>Siswa</div><div class="stat"><span>${p.count??0}</span>Presensi hari ini</div></div>
  <div class="card" style="margin-top:1rem"><h3>Mulai dari mana?</h3><div class="row">
  <button data-g="presensi">📅 Isi presensi</button><button class="alt" data-g="nilai">📝 Input nilai</button><button class="alt" data-g="kelas">👩‍🏫 Kelola kelas</button></div></div>`;
  document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{view=b.dataset.g;shell()});
}

/* ---------- Kelas & siswa ---------- */
async function kelas(selId){
  const ks = await listKelas(); const sel = selId || ks[0]?.id;
  let html = `<h1>Kelas saya</h1><div class="card"><label for="kn">Tambah kelas baru</label><div class="row"><input id="kn" placeholder="Contoh: Kelas 5A"><button id="ka">Tambah kelas</button></div></div>`;
  if(ks.length){
    const {data:ss} = await sb.from('siswa').select('*').eq('kelas_id',sel).order('nama');
    html += `<div class="card"><label for="ks">Pilih kelas</label>${kelasSelect(ks,'ks',sel)}
    <h3 style="margin-top:1rem">Daftar siswa (${ss?.length||0})</h3>
    ${(ss||[]).map(x=>`<div class="item"><div><b>${esc(x.nama)}</b><br><span class="muted">NIS: ${esc(x.nis||'-')}</span></div><button class="danger" data-d="${x.id}">Hapus</button></div>`).join('')||'<p class="muted">Belum ada siswa.</p>'}
    <label for="sn">Tambah siswa</label><div class="row"><input id="sn" placeholder="Nama siswa"><input id="si" placeholder="NIS (boleh kosong)"><button id="sa">Tambah siswa</button></div></div>`;
  }
  $('#main').innerHTML = html;
  $('#ka').onclick = async()=>{const n=$('#kn').value.trim();if(!n)return;await sb.from('kelas').insert({nama:n});toast('Kelas tersimpan');kelas()};
  if(ks.length){
    $('#ks').onchange = e=>kelas(e.target.value);
    $('#sa').onclick = async()=>{const n=$('#sn').value.trim();if(!n)return;await sb.from('siswa').insert({nama:n,nis:$('#si').value.trim()||null,kelas_id:sel});toast('Siswa tersimpan');kelas(sel)};
    document.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(confirm('Hapus siswa ini beserta nilainya?')){await sb.from('siswa').delete().eq('id',b.dataset.d);kelas(sel)}});
  }
}

/* ---------- Presensi ---------- */
const STATUS = ['Hadir','Sakit','Izin','Alpa','Terlambat'];
async function presensi(selId, tgl=today()){
  const ks = await listKelas(); if(!ks.length) return needKelas(), $('#go').onclick=()=>{view='kelas';shell()};
  const sel = selId || ks[0].id;
  const {data:ss} = await sb.from('siswa').select('*').eq('kelas_id',sel).order('nama');
  const {data:ex} = await sb.from('presensi').select('siswa_id,status').eq('tanggal',tgl).in('siswa_id',(ss||[]).map(x=>x.id));
  const st = Object.fromEntries((ex||[]).map(x=>[x.siswa_id,x.status]));
  (ss||[]).forEach(x=>st[x.id]=st[x.id]||'Hadir');
  $('#main').innerHTML = `<h1>Presensi</h1><div class="card"><div class="row"><div><label for="ps">Kelas</label>${kelasSelect(ks,'ps',sel)}</div><div><label for="pt">Tanggal</label><input id="pt" type="date" value="${tgl}"></div></div></div>
  <div class="card">${(ss||[]).map(x=>`<div style="padding:.6rem 0;border-bottom:2px solid var(--bg)"><b>${esc(x.nama)}</b><div class="seg" data-s="${x.id}">${STATUS.map(s=>`<button class="${st[x.id]===s?'on':''}" data-v="${s}">${s}</button>`).join('')}</div></div>`).join('')||'<p class="muted">Kelas ini belum punya siswa.</p>'}</div>
  ${ss?.length?'<button id="sv" style="width:100%">Simpan presensi</button>':''}`;
  $('#ps').onchange=e=>presensi(e.target.value,$('#pt').value); $('#pt').onchange=e=>presensi(sel,e.target.value);
  document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{const id=b.parentNode.dataset.s;st[id]=b.dataset.v;b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))});
  if(ss?.length) $('#sv').onclick=async()=>{
    const {error}=await sb.from('presensi').upsert(ss.map(x=>({siswa_id:x.id,tanggal:tgl,status:st[x.id]})),{onConflict:'siswa_id,tanggal'});
    toast(error?'Gagal menyimpan':'Presensi tersimpan ✓')};
}

/* ---------- Nilai ---------- */
const W0 = {tugas:20,kuis:10,uts:30,uas:40};
async function nilai(selId, mapel){
  const ks = await listKelas(); if(!ks.length) return needKelas(), $('#go').onclick=()=>{view='kelas';shell()};
  const sel = selId || ks[0].id; mapel = mapel ?? localStorage.getItem('gc_mapel') ?? '';
  const W = JSON.parse(localStorage.getItem('gc_bobot')||'null') || W0;
  const {data:ss} = await sb.from('siswa').select('*').eq('kelas_id',sel).order('nama');
  const {data:nl} = mapel ? await sb.from('nilai').select('*').eq('mapel',mapel).in('siswa_id',(ss||[]).map(x=>x.id)) : {data:[]};
  const nv = Object.fromEntries((nl||[]).map(x=>[x.siswa_id,x]));
  const K = ['tugas','kuis','uts','uas'], L = {tugas:'Tugas',kuis:'Kuis',uts:'UTS',uas:'UAS'};
  $('#main').innerHTML = `<h1>Input nilai</h1><div class="card"><div class="row"><div><label for="ns">Kelas</label>${kelasSelect(ks,'ns',sel)}</div><div><label for="nm">Mata pelajaran</label><input id="nm" value="${esc(mapel)}" placeholder="Contoh: Matematika"></div></div>
  <label>Bobot nilai (%)</label><div class="row">${K.map(k=>`<div>${L[k]}<input class="w" data-k="${k}" type="number" inputmode="numeric" value="${W[k]}"></div>`).join('')}</div></div>
  ${!mapel?'<div class="card">Isi mata pelajaran, lalu tekan Enter.</div>':`<div class="card tbl"><table><tr><th>Siswa</th>${K.map(k=>`<th>${L[k]}</th>`).join('')}<th>Nilai akhir</th></tr>
  ${(ss||[]).map(x=>`<tr data-id="${x.id}"><td>${esc(x.nama)}</td>${K.map(k=>`<td><input data-k="${k}" type="number" inputmode="decimal" min="0" max="100" value="${nv[x.id]?.[k]??''}"></td>`).join('')}<td class="final">-</td></tr>`).join('')}</table></div>
  <button id="sv" style="width:100%">Simpan nilai</button>`}`;
  $('#ns').onchange=e=>nilai(e.target.value,$('#nm').value);
  $('#nm').onchange=e=>{localStorage.setItem('gc_mapel',e.target.value.trim());nilai(sel,e.target.value.trim())};
  const bobot=()=>Object.fromEntries([...document.querySelectorAll('.w')].map(i=>[i.dataset.k,+i.value||0]));
  const hitung=()=>{const w=bobot();localStorage.setItem('gc_bobot',JSON.stringify(w));
    document.querySelectorAll('tr[data-id]').forEach(tr=>{let s=0,t=0;tr.querySelectorAll('input').forEach(i=>{if(i.value!==''){s+=i.value*w[i.dataset.k];t+=w[i.dataset.k]}});tr.querySelector('.final').textContent=t?(s/t).toFixed(1).replace('.',','):'-'})};
  document.querySelectorAll('input').forEach(i=>i.addEventListener('input',hitung)); hitung();
  if(mapel) $('#sv').onclick=async()=>{
    const rows=[...document.querySelectorAll('tr[data-id]')].map(tr=>{const o={siswa_id:tr.dataset.id,mapel};tr.querySelectorAll('input').forEach(i=>o[i.dataset.k]=i.value===''?null:Math.min(100,+i.value));return o});
    const {error}=await sb.from('nilai').upsert(rows,{onConflict:'siswa_id,mapel'});toast(error?'Gagal menyimpan':'Nilai tersimpan ✓')};
}

/* ---------- Fitur berikutnya ---------- */
function lain(){
  const f=['Modul ajar & materi dengan AI','Pembuat soal & bank soal','Rubrik penilaian','Catatan perkembangan siswa','Siswa perlu perhatian','Remedial & pengayaan','Laporan & rapor','Pengumuman untuk orang tua'];
  $('#main').innerHTML=`<h1>Segera hadir</h1><div class="card">${f.map(x=>`<div class="item">${x}<span class="muted">Segera</span></div>`).join('')}</div>`;
}

/* ---------- Mulai ---------- */
async function boot(){
  const {data}=await sb.auth.getSession();
  if(data.session){user=data.session.user;shell()}else loginView();
}
boot();
</script>
</body>
</html>
